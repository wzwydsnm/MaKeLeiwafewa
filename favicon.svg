<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1208"/>
      <stop offset="100%" style="stop-color:#0a0604"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#92400e"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  <!-- 圆形背景 -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- 外圈金边 -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <!-- 内圈细金边 -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  
  <!-- 龙首主体 正面剪影 琥珀金色 -->
  <!-- 头顶冠/角 -->
  <path d="M256 60 L232 120 L256 140 L280 120 Z" fill="url(#gold)"/>
  <path d="M196 80 L180 140 L212 150 L220 110 Z" fill="url(#gold)"/>
  <path d="M316 80 L332 140 L300 150 L292 110 Z" fill="url(#gold)"/>
  
  <!-- 龙头部主体轮廓 -->
  <path d="M256 100
           C 180 100, 130 160, 120 240
           C 115 290, 130 330, 160 360
           L 180 370 L 195 355 L 200 375
           L 220 380 L 230 360 L 256 370
           L 282 360 L 292 380 L 312 375
           L 317 355 L 332 370 L 352 360
           C 382 330, 397 290, 392 240
           C 382 160, 332 100, 256 100 Z"
        fill="url(#gold)"/>
  
  <!-- 龙眼（镂空 深色底透出） -->
  <ellipse cx="195" cy="230" rx="22" ry="18" fill="url(#bg)"/>
  <ellipse cx="317" cy="230" rx="22" ry="18" fill="url(#bg)"/>
  
  <!-- 龙眼睛瞳仁 发光琥珀色 -->
  <ellipse cx="195" cy="230" rx="10" ry="12" fill="url(#eye)"/>
  <ellipse cx="317" cy="230" rx="10" ry="12" fill="url(#eye)"/>
  
  <!-- 鼻孔 -->
  <ellipse cx="240" cy="310" rx="6" ry="8" fill="#1c1208"/>
  <ellipse cx="272" cy="310" rx="6" ry="8" fill="#1c1208"/>
  
  <!-- 嘴部线条 -->
  <path d="M220 340 Q256 360 292 340" fill="none" stroke="#1c1208" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 獠牙 -->
  <path d="M235 345 L230 365 L242 355 Z" fill="#fef3c7"/>
  <path d="M277 345 L282 365 L270 355 Z" fill="#fef3c7"/>
  
  <!-- 龙须 -->
  <path d="M170 310 Q150 330 155 360" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M342 310 Q362 330 357 360" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- 眉骨隆起 -->
  <path d="M165 200 Q195 180 225 200" fill="none" stroke="#1c1208" stroke-width="6" stroke-linecap="round"/>
  <path d="M287 200 Q317 180 347 200" fill="none" stroke="#1c1208" stroke-width="6" stroke-linecap="round"/>
  
  <!-- 龙鳞纹理 额头 -->
  <path d="M230 150 L256 135 L282 150 L256 165 Z" fill="none" stroke="#1c1208" stroke-width="2" opacity="0.6"/>
  <path d="M210 175 L230 160 L256 175 L230 190 Z" fill="none" stroke="#1c1208" stroke-width="2" opacity="0.5"/>
  <path d="M256 175 L282 160 L302 175 L282 190 Z" fill="none" stroke="#1c1208" stroke-width="2" opacity="0.5"/>
</svg>
